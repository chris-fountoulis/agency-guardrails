name: agency-guardrails
description: Lint your marketing like you lint your code. Business, legal and house-style rules for content, with PR annotations and SARIF.
author: Chris Fountoulis
branding:
  icon: shield
  color: blue

inputs:
  paths:
    description: Files or directories to check, separated by spaces.
    required: false
    default: "."
  config:
    description: Path to guardrails.toml. Default is discovered from the first path.
    required: false
    default: ""
  fail-on:
    description: Lowest severity that fails the step (error, warn or never). Default comes from the config, else error.
    required: false
    default: ""
  packs:
    description: Only run these packs, separated by spaces. Default runs what the config enables.
    required: false
    default: ""
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning. Needs `security-events: write`."
    required: false
    default: "false"
  sarif-file:
    description: Where to write the SARIF report.
    required: false
    default: guardrails.sarif
  setup-python:
    description: Set up Python with actions/setup-python. Set to false if the job already has Python 3.9 or newer.
    required: false
    default: "true"
  python-version:
    description: Python version for actions/setup-python.
    required: false
    default: "3.12"

outputs:
  errors:
    description: Number of error findings.
    value: ${{ steps.run.outputs.errors }}
  warnings:
    description: Number of warning findings.
    value: ${{ steps.run.outputs.warnings }}
  exit-code:
    description: Exit code of guardrails check (0 clean, 1 findings, 2 usage or config error).
    value: ${{ steps.run.outputs.exit-code }}
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agency-guardrails
      shell: bash
      env:
        GR_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$GR_ACTION_PATH"

    - name: Run guardrails check
      id: run
      shell: bash
      env:
        GR_PATHS: ${{ inputs.paths }}
        GR_CONFIG: ${{ inputs.config }}
        GR_FAIL_ON: ${{ inputs.fail-on }}
        GR_PACKS: ${{ inputs.packs }}
        GR_SARIF: ${{ inputs.sarif-file }}
      run: |
        set +e
        args=(check --format github --sarif-file "$GR_SARIF")
        if [ -n "$GR_CONFIG" ]; then args+=(--config "$GR_CONFIG"); fi
        if [ -n "$GR_FAIL_ON" ]; then args+=(--fail-on "$GR_FAIL_ON"); fi
        for pack in $GR_PACKS; do args+=(--pack "$pack"); done
        read -r -a paths <<< "$GR_PATHS"
        guardrails "${args[@]}" "${paths[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$GR_SARIF" ]; then
          python - "$GR_SARIF" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        results = json.load(open(sys.argv[1]))["runs"][0]["results"]
        errors = sum(1 for r in results if r["level"] == "error")
        print("errors=%d" % errors)
        print("warnings=%d" % (len(results) - errors))
        PY
          python - "$GR_SARIF" >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import json, sys
        run = json.load(open(sys.argv[1]))["runs"][0]
        results = run["results"]
        print("### agency-guardrails\n")
        if not results:
            print("No findings.")
        else:
            print("| Location | Rule | Level | Message |")
            print("| --- | --- | --- | --- |")
            for r in results[:200]:
                loc = r["locations"][0]["physicalLocation"]
                where = "%s:%d" % (loc["artifactLocation"]["uri"], loc["region"]["startLine"])
                msg = r["message"]["text"].split(" Fix: ")[0].replace("|", "\\|")
                print("| `%s` | %s | %s | %s |" % (where, r["ruleId"], r["level"], msg))
            if len(results) > 200:
                print("\n%d more findings in the SARIF report." % (len(results) - 200))
        PY
        fi
        exit 0

    - name: Upload SARIF to code scanning
      if: inputs.upload-sarif == 'true' && steps.run.outputs.exit-code != '2'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: agency-guardrails

    - name: Fail on findings
      if: steps.run.outputs.exit-code != '0'
      shell: bash
      env:
        GR_EXIT: ${{ steps.run.outputs.exit-code }}
      run: |
        echo "agency-guardrails exited with $GR_EXIT (1 = findings at or above fail-on, 2 = usage or config error)"
        exit "$GR_EXIT"
