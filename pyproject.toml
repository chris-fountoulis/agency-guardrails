[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-guardrails"
dynamic = ["version"]
description = "Lint your marketing like you lint your code: guardrails for AI agents that write and ship agency content."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chris Fountoulis", email = "chris@growthofinfluence.com" }]
keywords = ["claude-code", "hooks", "linter", "marketing", "compliance", "seo", "aeo", "secrets", "github-action"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chris-fountoulis/agency-guardrails"
Documentation = "https://github.com/chris-fountoulis/agency-guardrails/tree/main/docs"
Issues = "https://github.com/chris-fountoulis/agency-guardrails/issues"
Changelog = "https://github.com/chris-fountoulis/agency-guardrails/blob/main/CHANGELOG.md"

[project.scripts]
guardrails = "agency_guardrails.cli:main"

[tool.setuptools]
packages = ["agency_guardrails", "agency_guardrails.rules"]

[tool.setuptools.dynamic]
version = { attr = "agency_guardrails.__version__" }
