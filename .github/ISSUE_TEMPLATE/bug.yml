name: Bug or false positive
description: A rule fires when it should not, misses something it should catch, or the CLI, hooks or action misbehave.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A rule fires when it should not (false positive)
        - A rule misses a case (false negative)
        - CLI
        - Claude Code hooks or plugin
        - GitHub Action
        - Config loading
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule id
      description: For example GR-EU-002. Leave empty if no rule is involved.
  - type: textarea
    id: repro
    attributes:
      label: Smallest input that shows the problem
      description: The shortest Markdown, HTML, command or hook payload that reproduces it. Remove client names and anything confidential.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: guardrails.toml (relevant part)
      render: toml
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Output of `guardrails --version`, Python version, OS, Claude Code version if hooks are involved.
    validations:
      required: true
